# This workflow will install Python dependencies, run tests and lint.
# For more information see: https://docs.github.com/en/actions/use-cases-and-examples/building-and-testing/building-and-testing-python

name: Test docker-container-collector

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - "integrations/docker-container-collector/**"
      - ".github/workflows/test.yml"
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - "integrations/docker-container-collector/**"
      - ".github/workflows/test.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.12', '3.13']

    defaults:
      run:
        working-directory: integrations/docker-container-collector

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install requirements
        run: |
          pip install -r requirements.txt

      - name: Install dependencies
        run: |
          pip install .[test]

      - name: Lint with ruff
        run: |
          ruff check .

      - name: Run tests
        run: |
          pytest -v
